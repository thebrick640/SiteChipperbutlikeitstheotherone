<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/img/favicon3.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Coolbrador</title>
  <link rel="stylesheet" href="styles-login.css">
  <script>
    (function () {
      try {
        var known = ["default","green","ember","violet","ocean","rose","slate"];
        var t = localStorage.getItem("cb_theme") || "default";
        if (t === "certa-green") {
          t = "green";
          try { localStorage.setItem("cb_theme", "green"); } catch (e) {}
        }
        if (t === "light") {
          t = "default";
          try {
            localStorage.setItem("cb_theme", "default");
            if (!localStorage.getItem("cb_mode")) localStorage.setItem("cb_mode", "light");
          } catch (e) {}
        }
        if (known.indexOf(t) === -1) t = "default";
        var mode = localStorage.getItem("cb_mode") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.mode = mode;
        if (t !== "default") document.documentElement.classList.add("pre-theme-" + t);
        var wall = localStorage.getItem("cb_wallpaper");
        if (wall) {
          document.documentElement.classList.add("cb-has-wallpaper");
          document.documentElement.style.setProperty("--cb-wallpaper", 'url("' + wall.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '")');
          document.documentElement.style.setProperty("--cb-wallpaper-tint", (localStorage.getItem("cb_wallpaper_tint") || "55") + "%");
          document.documentElement.style.setProperty("--cb-wallpaper-blur", (localStorage.getItem("cb_wallpaper_blur") || "0") + "px");
        }
        var accent = localStorage.getItem("cb_custom_accent");
        if (accent) {
          document.documentElement.style.setProperty("--cb-accent", accent);
          document.documentElement.style.setProperty("--cb-link", accent);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">Coolbrador</div>
    <p class="subtitle">Bark up the right tree!</p>

    <!-- Login Form (Firebase email auth) -->
    <div id="loginForm" class="form active">
      <label class="field-label" for="loginUsername">Email</label>
      <input type="email" id="loginUsername" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <div class="extra">
        <label><input type="checkbox" id="rememberMe" checked> Remember me</label>
        <button type="button" id="forgotPassword" class="linklike" style="cursor:pointer;color:var(--cb-accent);background:none;border:0;padding:0;font:inherit;">Forgot password?</button>
      </div>
      <button id="loginButton" type="button">Log In</button>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="form">
      <input type="text" id="signupUsername" placeholder="Display name" maxlength="40" autocomplete="nickname">
      <input type="text" id="signupHandle" placeholder="@handle (letters, numbers, _)" maxlength="25" autocomplete="username" spellcheck="false">
      <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password (6+ characters)" autocomplete="new-password">
      <button id="signupButton" type="button">Create Account</button>
    </div>

    <!-- Toggle link -->
    <div class="toggle">
      <span id="toggleText">Don't have an account? Sign up</span>
    </div>

    <p id="result"></p>
    <p class="legal">(c) 2026 Coolbrador LLC - All rights reserved</p>

    <!-- reCAPTCHA container (still needed for SMS MFA) -->
    <div id="recaptcha-container"></div>
  </div>

  <!-- ---------------------------------------------- -->
  <!-- MAIN SCRIPT - Google parts removed             -->
  <!-- ---------------------------------------------- -->
  <script type="module">
    import { auth } from './js/firebase.js';
    import cloud from './js/cb-cloud.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      sendEmailVerification,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      RecaptchaVerifier,
      PhoneAuthProvider,
      PhoneMultiFactorGenerator,
      getMultiFactorResolver
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    let isLogin = true;
    let busy = false;
    let recaptchaVerifier = null;

    function showMessage(text, color = "#aaa") {
      const result = document.getElementById("result");
      result.textContent = text;
      result.style.color = color;
    }

    // Only same-site paths, so ?next= cannot redirect off Coolbrador.
    function nextUrl() {
      const n = new URLSearchParams(location.search).get("next") || "";
      return /^\/(?!\/)[^\s]*$/.test(n) && !/^\/login/.test(n) ? n : "/";
    }

    function setBusy(on) {
      busy = on;
      ["loginButton", "signupButton"].forEach((id) => {
        const b = document.getElementById(id);
        if (b) b.disabled = on;
      });
    }

    async function finishSignIn(user, opts) {
      await cloud.syncSession(user, opts);
      showMessage("Welcome to Coolbrador!", "#a6e3a1");
      setTimeout(() => { window.location.href = nextUrl(); }, 400);
    }

    function friendlyAuthError(err, fallback) {
      switch (err && err.code) {
        case "auth/email-already-in-use": return "That email already has an account. Try logging in.";
        case "auth/invalid-email": return "That email address looks invalid.";
        case "auth/weak-password": return "Password must be at least 6 characters.";
        case "auth/user-not-found": return "No account found for that email.";
        case "auth/wrong-password":
        case "auth/invalid-credential":
        case "auth/invalid-login-credentials": return "Wrong email or password.";
        case "auth/too-many-requests": return "Too many attempts. Try again in a bit.";
        case "auth/user-disabled": return "This account is disabled.";
        case "auth/network-request-failed": return "Network error. Check your connection.";
        case "permission-denied": return "Your account could not be set up (permission denied).";
        default: return fallback;
      }
    }

    async function applyPersistence() {
      const remember = document.getElementById("rememberMe");
      await setPersistence(auth, remember && !remember.checked ? browserSessionPersistence : browserLocalPersistence);
    }

    // --- SIGNUP: create the auth user first, then the profile transaction ---
    async function signup() {
      if (busy) return;
      const username = document.getElementById("signupUsername").value.trim();
      const handleRaw = document.getElementById("signupHandle").value.trim().replace(/^@/, "");
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      if (!username || !email || !password) return showMessage("Fill in your name, email and password.", "#ff5555");
      if (password.length < 6) return showMessage("Password must be at least 6 characters.", "#ff5555");
      const handle = cloud.normalizeHandle(handleRaw || username);
      if (handleRaw && handle !== handleRaw.toLowerCase()) {
        return showMessage("Handles use 3-24 letters, numbers or underscores. Try @" + handle, "#ff5555");
      }

      setBusy(true);
      showMessage("Creating your account...");
      try {
        if (handleRaw && !(await cloud.isHandleAvailable(handle))) {
          showMessage("@" + handle + " is taken. Pick another handle.", "#ff5555");
          return;
        }
        await applyPersistence();
        cloud.setPendingSignup({ username, handle });
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        updateProfile(cred.user, { displayName: username }).catch(() => {});
        try { await sendEmailVerification(cred.user); } catch (_) {}
        await finishSignIn(cred.user, { username, handle });
      } catch (err) {
        cloud.setPendingSignup(null);
        console.error("Signup error:", err);
        showMessage(friendlyAuthError(err, "Could not create your account. Please try again."), "#ff5555");
      } finally {
        setBusy(false);
      }
    }

    // --- LOGIN ---
    async function login() {
      if (busy) return;
      const email = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;
      if (!email || !password) return showMessage("Enter your email and password.", "#ff5555");

      setBusy(true);
      showMessage("Logging in...");
      try {
        await applyPersistence();
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await finishSignIn(cred.user);
      } catch (err) {
        if (err && err.code === "auth/multi-factor-auth-required") {
          await resolveMfa(err);
        } else {
          console.error("Login error:", err);
          showMessage(friendlyAuthError(err, "Could not sign in. Check your email and password."), "#ff5555");
        }
      } finally {
        setBusy(false);
      }
    }

    // --- SMS second factor for accounts that enrolled it ---
    async function resolveMfa(err) {
      try {
        if (!recaptchaVerifier) {
          recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" });
          await recaptchaVerifier.render();
        }
        const resolver = getMultiFactorResolver(auth, err);
        const hint = resolver.hints[0];
        const verificationId = await new PhoneAuthProvider(auth).verifyPhoneNumber(
          { multiFactorHint: hint, session: resolver.session }, recaptchaVerifier);
        const code = prompt("Enter the 6-digit code sent to " + (hint.phoneNumber || "your phone") + ":");
        if (!code) throw new Error("No code entered");
        const cred = PhoneAuthProvider.credential(verificationId, code.trim());
        const result = await resolver.resolveSignIn(PhoneMultiFactorGenerator.assertion(cred));
        await finishSignIn(result.user);
      } catch (mfaErr) {
        console.error("MFA error:", mfaErr);
        showMessage("Two-factor sign-in failed. Try again.", "#ff5555");
      }
    }

    async function forgotPassword() {
      const email = document.getElementById("loginUsername").value.trim()
        || (prompt("Enter the email for your account:") || "").trim();
      if (!email) return;
      try {
        await sendPasswordResetEmail(auth, email);
        showMessage("If that email has an account, a reset link is on its way.", "#a6e3a1");
      } catch (err) {
        showMessage(friendlyAuthError(err, "Could not send a reset email."), "#ff5555");
      }
    }

    function toggleForms() {
      isLogin = !isLogin;
      document.getElementById("loginForm").classList.toggle("active");
      document.getElementById("signupForm").classList.toggle("active");
      document.getElementById("toggleText").textContent =
        isLogin ? "Don't have an account? Sign up" : "Already have an account? Log in";
      showMessage("");
    }

    document.getElementById("toggleText").addEventListener("click", toggleForms);
    document.getElementById("loginButton").addEventListener("click", login);
    document.getElementById("signupButton").addEventListener("click", signup);
    document.getElementById("forgotPassword").addEventListener("click", forgotPassword);
    if (new URLSearchParams(location.search).get("mode") === "signup") toggleForms();
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") isLogin ? login() : signup();
    });

    // Already signed in? Go straight back.
    cloud.ready.then(() => {
      if (auth.currentUser && cloud.currentProfile()) window.location.replace(nextUrl());
    });
  </script>
</body>
</html>
